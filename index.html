<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: transparent; /* Transparent background for Electron */
    }
    
    /* Clean transparent background for production */
    html {
      overscroll-behavior-x: none;
      touch-action: none;
    }
    body {
      display: flex;
      flex-wrap: wrap;
      /* Ensure the body fills the window */
      width: 100vw;
      height: 100vh;
    }
    body > canvas:only-child {
      width: 100vw;
      height: 100vh;
    }
    
    /* Clean desktop avatar - no UI elements */
  </style>
  <!-- Live2DCubismCore script -->
  <script src = "./Core/live2dcubismcore.js"></script>
  <!-- Build script -->
  <script src = "./src/main.ts" type="module"></script>
</head>
<body>
  <!-- Debug controls removed for clean desktop avatar -->
</body>
</html>
